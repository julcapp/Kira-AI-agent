name: FinExpert isolated prototype checks

on:
  pull_request:
    paths:
      - "app/finexpert/**"
      - "tests/test_finexpert_*.py"
      - "requirements.txt"
      - ".github/workflows/finexpert-tests.yml"
  push:
    branches:
      - "feature/finexpert-documents-mvp"
    paths:
      - "app/finexpert/**"
      - "tests/test_finexpert_*.py"
      - "requirements.txt"
      - ".github/workflows/finexpert-tests.yml"

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic vault tests
        run: python -m pytest tests/test_finexpert_*.py -q
