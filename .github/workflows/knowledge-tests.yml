name: Knowledge API tests
on:
  push:
    branches:
      - feature/persistent-skills-brands-api
  pull_request:
    paths:
      - "app/knowledge/**"
      - "app/skills/**"
      - "app/brands/**"
      - "app/db.py"
      - "app/main.py"
      - "migrations/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/knowledge-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Test fresh database migration
        env:
          DATABASE_URL: sqlite:////tmp/kiryusha-knowledge-ci.db
        run: |
          alembic upgrade head
          alembic current
